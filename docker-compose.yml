services:

  nginx:
    image: skpr/nginx-drupal:dev-v2-latest
    ports:
      - "8080:8080"
      - "28624:28624"
    volumes:
      - ./docker/compose/nginx/20-node.conf:/etc/nginx/conf.d/location/20-node.conf

  php-fpm:
    build: ./docker/compose/php-fpm
    network_mode: service:nginx
    pid: "service:nginx"
    environment:
      - COMPASS_ENABLED=true
      - COMPASS_FUNCTION_THRESHOLD=1000000
      - RUST_BACKTRACE=1 # Debugging

  node:
    build: ./docker/compose/node
    network_mode: service:nginx
    pid: "service:nginx"
    depends_on:
      - php-fpm
    environment:
      - COMPASS_ENABLED=true
      - COMPASS_FUNCTION_THRESHOLD=0

  sidecar:
    build: .
    # environment:
    #   - COMPASS_SIDECAR_TOKEN=xxxyyyzzz
    network_mode: service:nginx
    # Compass needs these.
    privileged: true
    pid: "service:nginx"
    depends_on:
      - php-fpm
      - node

  compass:
    build: .
    command: /bin/bash -c "sleep infinity"
    network_mode: service:nginx
    depends_on:
      - sidecar

  curl:
    image: alpine:latest
    network_mode: service:nginx
    command: sh -c "apk add --no-cache curl && curl -v http://localhost:28624/v1/traces"
    depends_on:
      - compass
