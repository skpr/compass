[tools]
go = "1.25"
"go:github.com/cilium/ebpf/cmd/bpf2go" = { version = "v0.19.0" }
"ubi:golangci/golangci-lint" = "2.6.2"

[env]
CGO_ENABLED = 0

[tasks.vendor]
description = "Vendor resets the main module's vendor directory to include all packages needed to build the application"
run = "go mod vendor"

[tasks.lint]
description = "Run linting on all tracer components"
run = "golangci-lint run"
depends = ["generate", "vendor"]

[tasks.test]
description = "Run tests for all tracer components"
run = "go test ./cmd/... ./pkg/..."
depends = ["generate"]

[tasks."test:race"]
description = "Run tests with the race detector"
env = { CGO_ENABLED = "1" }
run = "go test -race ./cmd/... ./pkg/..."
depends = ["generate"]

[tasks.generate]
description = "Executes bpf2go on multiple given directories"
depends = [
  "bpf2go pkg/tracer/php/cli cli",
  "bpf2go pkg/tracer/php/fpm fpm",
  "bpf2go pkg/tracer/node/http http",
]

[tasks.bpf2go]
description = "Executes bpf2go on a given directory"
usage = '''
arg "<path>" help="Path to the package"
arg "<package>" help="Name of the package"
'''
run = '''
#!/usr/bin/env bash
cd {{arg(name="path")}}
bpftool btf dump file /sys/kernel/btf/vmlinux format c > ./includes/vmlinux.h
GOPACKAGE={{arg(name="package")}} bpf2go -cflags '-O2 -g -Wall -Werror' -type event bpf program.bpf.c -- -I./includes
'''
depends = ["vendor"]

[tasks.build]
description = "Build all Compass tracing binaries"
depends = ["build:cli", "build:sidecar"]

[tasks."build:cli"]
description = "Build Compass CLI"
run = "go build -a -o _output/compass github.com/skpr/compass/cmd/compass"
depends = ["generate"]

[tasks."build:sidecar"]
description = "Build Compass sidecar"
run = "go build -a -o _output/compass-sidecar github.com/skpr/compass/cmd/compass-sidecar"
depends = ["generate"]
