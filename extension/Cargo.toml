[package]
name = "compass-extension"
version = "0.1.0"
edition = "2024"

[lib]
name = "compass_extension"
crate-type = ["lib", "cdylib"]

[dependencies]
anyhow = "1.0.102"
coarsetime = "0.1.37"
phper = "0.17.2"
probe = "0.5.2"
once_cell = "1.21.4"
nix = "0.31.2"
chrono = "0.4.44"
tracing = "0.1.44"
rustc-hash = "2.1.2"
cached = "0.59"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
